# Desired state. ACL entry order is significant and must match the intended policy.
hostname: Router1
strict: false
interfaces:
  GigabitEthernet0/0:
    description: Uplink to LAN
    ipv4_address: 192.168.1.1
    ipv4_mask: 255.255.255.0
    admin_state: up
    access_groups:
      in: "100"
  GigabitEthernet0/1:
    ipv4_address: 10.0.0.1
    ipv4_mask: 255.255.255.0
    admin_state: down
acls:
  "100":
    type: extended
    entries:
      - permit ip 192.168.1.0 0.0.0.255 any
      - deny ip any any
ospf:
  "1":
    router_id: 1.1.1.1
    networks:
      - network: 192.168.1.0
        wildcard: 0.0.0.255
        area: "0"
