[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netstate-reconciler"
version = "0.3.0"
description = "A desired-state configuration drift auditor and cautious remediation planner for Cisco IOS networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NetState Reconciler contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ssh = ["netmiko>=4.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[project.scripts]
netstate = "netstate.cli:main"
netstate-scheduled-audit = "netstate.scheduler:main"
netstate-evaluate-corpus = "netstate.corpus_eval:main"
