[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netstate-reconciler"
version = "1.2.0"
description = "Desired-state Cisco Packet Tracer configuration drift detection and reconciliation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "NetState Reconciler Project"}]
dependencies = [
  "streamlit>=1.40,<2",
  "graphviz>=0.20,<1",
  "PyYAML>=6.0,<7",
  "pydantic>=2.11,<3",
  "mcp>=1.13,<2",
  "packet-tracer-mcp==0.10.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
